<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 290" width="910" role="img" aria-label="Wiring: both pods plug into the Pinpoint, the Pinpoint plugs into a Control Hub I2C port" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Wiring: both pods plug into the Pinpoint, the Pinpoint plugs into a Control Hub I2C port</title>
