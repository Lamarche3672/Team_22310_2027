<path d="M 932 1186 L 910 1186 L 751 1178" fill="none" stroke="#9AA3B2" stroke-width="2"/>
<circle cx="751" cy="1178" r="4" fill="#14181F"/>
<text x="640" y="1376" font-size="19" font-weight="700" text-anchor="middle" fill="#14181F">Buzz on this gamepad = aimed. Long buzz = field-centric lost, two short = back.</text>
<text x="56" y="1482" font-size="18" fill="#5B6472">Before START, on either gamepad: X = blue alliance, B = red alliance. It remembers the alliance from auto.</text>
<text x="56" y="1510" font-size="18" fill="#5B6472">Shooter speed and P, I, F: D-PAD left/right picks the line on the screen, up/down changes it. Saved by itself.</text>
