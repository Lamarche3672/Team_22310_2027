<circle cx="765" cy="456" r="4" fill="#14181F"/>
<text x="640" y="726" font-size="19" font-weight="700" text-anchor="middle" fill="#14181F">To shoot: hold RIGHT BUMPER, wait for the buzz, then hold LEFT BUMPER.</text>
