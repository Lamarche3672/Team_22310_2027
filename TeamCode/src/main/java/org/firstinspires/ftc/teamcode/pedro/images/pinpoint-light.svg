<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 330" width="910" role="img" aria-label="What the Pinpoint light colours mean" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>What the Pinpoint light colours mean</title>

<rect x="1" y="1" width="908" height="328" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<rect x="20" y="20" width="870" height="40" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="46" cy="40" r="11" fill="#16A34A" stroke="#16A34A" stroke-width="3"/>
<text x="70" y="45" font-size="13" font-weight="700" fill="#16A34A" text-anchor="start">GREEN</text>
<text x="150" y="45" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start">Ready</text>
<text x="350" y="45" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Nothing to fix.</text>
<rect x="20" y="70" width="870" height="40" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="46" cy="90" r="11" fill="#DC2626" stroke="#DC2626" stroke-width="3"/>
<text x="70" y="95" font-size="13" font-weight="700" fill="#DC2626" text-anchor="start">RED</text>
<text x="150" y="95" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start">Starting up</text>
<text x="350" y="95" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Keep the robot still. It turns green in about a second.</text>
<rect x="20" y="120" width="870" height="40" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="46" cy="140" r="11" fill="#2563EB" stroke="#2563EB" stroke-width="3"/>
<text x="70" y="145" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">BLUE</text>
<text x="150" y="145" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start">Forward pod not seen</text>
<text x="350" y="145" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Robot off. Push the forward pod's cable into the X port.</text>
<rect x="20" y="170" width="870" height="40" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="46" cy="190" r="11" fill="#EA580C" stroke="#EA580C" stroke-width="3"/>
<text x="70" y="195" font-size="13" font-weight="700" fill="#EA580C" text-anchor="start">ORANGE</text>
<text x="150" y="195" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start">Sideways pod not seen</text>
<text x="350" y="195" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Robot off. Push the sideways pod's cable into the Y port.</text>
<rect x="20" y="220" width="870" height="40" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="46" cy="240" r="11" fill="#7C3AED" stroke="#7C3AED" stroke-width="3"/>
<text x="70" y="245" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="start">PURPLE</text>
<text x="150" y="245" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start">No pods seen</text>
<text x="350" y="245" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Robot off. Check both pod cables.</text>
<rect x="20" y="270" width="870" height="40" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="46" cy="290" r="11" fill="#FFFFFF" stroke="#64748B" stroke-width="3"/>
<text x="70" y="295" font-size="13" font-weight="700" fill="#64748B" text-anchor="start">OFF</text>
<text x="150" y="295" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start">No power</text>
<text x="350" y="295" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Check the cable from the Pinpoint to the Control Hub.</text>
</svg>
